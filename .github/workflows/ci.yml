name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test-os:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run tests
        run: nix develop -c cargo test

  # Single check named "test" for the master ruleset's required status check.
  test:
    if: always()
    needs: test-os
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "test-os: ${{ needs.test-os.result }}"
          test "${{ needs.test-os.result }}" = success
